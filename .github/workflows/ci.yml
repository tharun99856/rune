name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        # Installs via pyproject.toml -- catches packaging regressions
        # (missing [project] metadata, bad package discovery) that running
        # tests via pythonpath alone would never notice.
        run: python -m pip install -e .

      - name: Install test + backend deps
        run: |
          python -m pip install --upgrade pip
          # pytest + zig (self-contained C/C++ toolchain) are reliable, so the
          # native-C++ backend tests actually compile and run in CI.
          pip install pytest ziglang
          # numba is best-effort; if a wheel isn't available its backend tests
          # skip cleanly rather than failing the build.
          pip install numba numpy || echo "numba unavailable -> its tests will skip"

      - name: Console script works
        run: rune demo

      - name: Run tests
        run: python -m pytest -q
